services:
  sensex-ai:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # OpenAlgo on the host machine: set OPENALGO_HOST=http://host.docker.internal:5000 in .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
